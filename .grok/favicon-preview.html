<!doctype html>
<html>
<head>
  <style>
    body { margin: 0; background: #333; display: flex; gap: 24px; padding: 16px; align-items: flex-start; }
    figure { margin: 0; color: #F2EDE6; font: 12px/1.2 sans-serif; }
    .s16 { width: 16px; height: 16px; image-rendering: pixelated; }
    .s32 { width: 32px; height: 32px; }
    img, object, svg { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <figure><div class="s16"><img src="favicon-a.svg"></div><div class="s32"><img src="favicon-a.svg"></div>A towers</figure>
  <figure><div class="s16"><img src="favicon-b.svg"></div><div class="s32"><img src="favicon-b.svg"></div>B burst+towers</figure>
  <figure><div class="s16"><img src="favicon-c.svg"></div><div class="s32"><img src="favicon-c.svg"></div>C stroke</figure>
  <figure><div class="s16"><img src="favicon-d.svg"></div><div class="s32"><img src="favicon-d.svg"></div>D triune</figure>
</body>
</html>
